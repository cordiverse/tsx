name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  release:
    name: Release
    needs: test
    if: github.repository == 'privatenumber/tsx'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release
        env:
          # Preserve maintainer attribution for releases and issue comments.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: pnpm exec semantic-release

  # Publishes the version in package.json to npm unless that version already exists.
  publish:
    name: Publish
    needs: test
    if: github.repository == 'cordiverse/tsx'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check version
        id: check
        run: |
          set -euo pipefail
          name="$(jq -r .name package.json)"
          version="$(jq -r .version package.json)"
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${name/\//%2F}/${version}")"
          case "$status" in
            200)
              echo "${name}@${version} already exists on npm."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "${name}@${version} does not exist on npm."
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected registry response ${status} for ${name}@${version}."
              exit 1
              ;;
          esac

      - name: Install pnpm
        if: steps.check.outputs.publish == 'true'
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node.js
        if: steps.check.outputs.publish == 'true'
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        if: steps.check.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public --tag latest
